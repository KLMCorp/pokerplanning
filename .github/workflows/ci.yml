name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Type check, Test & Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Check TypeScript 7
      run: npx tsc -v | grep -q "Version 7"

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Tests
      run: npm run test:run

    - name: Build
      run: npm run build
